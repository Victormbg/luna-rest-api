worker_processes 1;

events {
    worker_connections 1024;
}

http {
    lua_package_path "$prefix/lua/?.lua;;";
    lua_need_request_body on;

    client_body_temp_path logs/client_body_temp;
    proxy_temp_path       logs/proxy_temp;
    fastcgi_temp_path     logs/fastcgi_temp;
    scgi_temp_path        logs/scgi_temp;
    uwsgi_temp_path       logs/uwsgi_temp;

    server {
        listen 8080;
        default_type application/json;

        # Rota para obtenção do Bearer Token (/token)
        location = /token {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-api-key' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            content_by_lua_file lua/controllers/auth_controller.lua;
        }

        # Rota para /usuarios ou /usuarios/1
        location ~ ^/usuarios/?([0-9]+)?$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-api-key' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            content_by_lua_file lua/controllers/usuario_controller.lua;
        }
    }
}
tasks:
  - name: Instalar OpenResty e MySQL
    init: |
      sudo apt-get update
      sudo apt-get install -y openresty mysql-server
    command: |
      # Inicia o serviço do MySQL
      sudo service mysql start
      
      # Cria o banco de dados e a tabela de testes
      sudo mysql -e "CREATE DATABASE IF NOT EXISTS meu_banco;"
      sudo mysql -e "CREATE USER IF NOT EXISTS 'root'@'localhost' IDENTIFIED BY 'senha_secreta';"
      sudo mysql -e "GRANT ALL PRIVILEGES ON meu_banco.* TO 'root'@'localhost';"
      sudo mysql -e "FLUSH PRIVILEGES;"
      sudo mysql -d meu_banco -e "CREATE TABLE IF NOT EXISTS usuario (id INT AUTO_INCREMENT PRIMARY KEY, nome VARCHAR(50), idade INT);"
      sudo mysql -d meu_banco -e "INSERT INTO usuario (nome, idade) VALUES ('Alice', 28), ('Bob', 32);"
      
      echo "=== AMBIENTE PRONTO! ==="
      echo "Para rodar a API execute: openresty -p . -c conf/nginx.conf"

ports:
  - port: 8080
    onOpen: open-preview
